name: Refresh public GitHub data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect public repositories and language bytes
        run: node scripts/refresh-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit public snapshots as repository owner
        env:
          GIT_AUTHOR_NAME: 'Halil Ozel'
          GIT_AUTHOR_EMAIL: 'halilozel1903@gmail.com'
          GIT_COMMITTER_NAME: 'Halil Ozel'
          GIT_COMMITTER_EMAIL: 'halilozel1903@gmail.com'
        run: |
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public GitHub data'
            git push origin HEAD:main
          fi
